name: Deploy qq-site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['qq-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep development tools out of the published site
        run: rm -f qq-site/lab.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qq-site
      - id: deployment
        uses: actions/deploy-pages@v4
